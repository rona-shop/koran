<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Koran — القرآن الكريم برواية ورش عن نافع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0d5c46; --green-d:#093f31; --gold:#c9a227; --gold-l:#e8cf7a;
  --paper:#fdf9ef; --paper-d:#f6efdd; --ink:#2b2b2b; --muted:#8a7f66;
  --card:#ffffff; --line:#e7dcc3;
  --red-d:#b71c1c; --red:#d84315; --orange:#ef6c00; --faded:#d47c8a;
  --ghunna:#2e7d32; --ikhfa:#00897b; --iqlab:#6a1b9a; --qalqala:#1565c0; --imala:#8e24aa; --silent:#b5b5b5;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:'Tajawal',sans-serif;background:var(--paper-d);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden}
/* ===== header ===== */
header{background:linear-gradient(135deg,var(--green-d),var(--green));color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:50;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;color:var(--gold-l);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand small{font-size:11px;font-weight:400;color:#d9e8dd;opacity:.9}
#menuBtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 11px;font-size:16px;cursor:pointer}
.searchbox{flex:1;min-width:150px;max-width:420px;position:relative}
.searchbox input{width:100%;padding:9px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-family:inherit;font-size:14px;outline:none}
.searchbox input::placeholder{color:rgba(255,255,255,.65)}
.hctl{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:700}
.hbtn.on{background:var(--gold);border-color:var(--gold);color:#3a2f05}
/* ===== layout ===== */
#app{flex:1;display:flex;min-height:0}
/* ===== sidebar ===== */
#sidebar{width:320px;max-width:86vw;background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;transition:margin .25s;z-index:40}
#app.sb-closed #sidebar{margin-inline-end:-321px}
#sbClose{display:none}
.stabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 6px;border-bottom:1px solid var(--line)}
.stab{flex:1 1 28%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 4px;font-family:inherit;font-size:13px;font-weight:700;color:var(--green-d);cursor:pointer}
.stab.on{background:var(--green);color:#fff;border-color:var(--green)}
.spanel{flex:1;overflow-y:auto;padding:10px;display:none}
.spanel.on{display:block}
.sfilter{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;margin-bottom:10px;background:var(--paper)}
.sitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.sitem:hover{background:var(--paper);border-color:var(--line)}
.sitem .num{background:var(--green);color:#fff;min-width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sitem .nm{font-weight:700;font-size:15px}
.sitem .sub{font-size:11px;color:var(--muted)}
.sitem .go{margin-inline-start:auto;color:var(--gold);font-weight:800}
.unit-head{font-weight:800;color:var(--green-d);margin:14px 4px 6px;font-size:14px}
/* ===== main reader ===== */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper)}
#crumb{padding:10px 18px 4px;font-size:13px;color:var(--muted);font-weight:700}
#reader{flex:1;overflow-y:auto;padding:10px 26px 140px;scroll-behavior:smooth}
.mushaf{max-width:920px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 4px 24px rgba(93,64,20,.08);position:relative}
.surah-head{text-align:center;margin-bottom:18px}
.surah-head .frame{border:2px solid var(--gold);border-radius:14px;padding:12px 20px;display:inline-block;background:linear-gradient(180deg,#fffdf6,#faf3df)}
.surah-head h2{margin:0;font-size:26px;color:var(--green-d);font-weight:800}
.surah-head .meta{font-size:12px;color:var(--muted);margin-top:4px}
.basmala{text-align:center;font-family:'Amiri Quran',serif;font-size:1.35em;color:var(--green-d);margin:14px 0 20px}
.qtext{font-family:'Amiri Quran',serif;font-size:30px;line-height:2.35;text-align:justify;word-spacing:2px}
.ayah{cursor:pointer;border-radius:8px;padding:2px 1px;transition:background .15s}
.ayah:hover{background:#f3e9cf}
.ayah.playing{background:#ffe9a8;box-shadow:0 0 0 2px var(--gold)}
.ayah-num{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border:2px solid var(--gold);color:var(--green-d);border-radius:50%;font-size:15px;font-family:'Tajawal';font-weight:800;margin:0 4px;background:#fffdf6;vertical-align:middle}
.divmark{display:inline-block;margin:6px 4px;padding:3px 12px;border-radius:20px;font-family:'Tajawal';font-size:12.5px;font-weight:800;border:1.5px dashed var(--green);color:var(--green-d);background:#eef7f2;vertical-align:middle}
.divmark.jz{background:var(--green);color:#fff;border-style:solid}
.divmark.hz{background:#fff;border:2px solid var(--gold);color:#8a6d00}
.sajda{display:inline-block;color:var(--green-d);font-weight:800;border:1.5px solid var(--green);border-radius:8px;padding:0 8px;margin:0 4px;font-size:.7em;vertical-align:middle;font-family:'Tajawal'}
.page-frame{border:2px solid var(--gold);border-radius:14px;padding:22px;background:#fffdf8;margin-bottom:16px}
.page-foot{text-align:center;color:var(--muted);font-size:13px;margin-top:14px;font-weight:700}
.surnav{display:flex;gap:10px;margin:14px 0}
.snbtn{flex:1;padding:13px 8px;border-radius:12px;border:2px solid var(--green);background:#fff;color:var(--green-d);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
.snbtn:disabled{opacity:.35;cursor:default;border-color:#ccc;color:#999}
.snbtn:not(:disabled):active{background:var(--green);color:#fff}
.sabab-surah{background:#fffdf6;border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;margin:0 0 6px;font-size:14px;line-height:1.9}
.sabab-surah b{color:var(--green-d)}
.sabab-surah .src-note{font-size:11px;color:var(--muted);margin-top:6px}
/* tajweed colors */
.tj .md-lazim{color:var(--red-d);font-weight:700}
.tj .md-mut{color:var(--red)}
.tj .md-munf{color:var(--orange)}
.tj .md-faded{color:var(--faded)}
.tj .ghunna{color:var(--ghunna)}
.tj .ikhfa{color:var(--ikhfa)}
.tj .iqlab{color:var(--iqlab)}
.tj .qalqala{color:var(--qalqala)}
.tj .imala{color:var(--imala)}
.tj .silent{color:var(--silent)}
/* ===== ayah modal ===== */
#modalWrap{position:fixed;inset:0;background:rgba(20,15,5,.55);display:none;align-items:flex-end;justify-content:center;z-index:100}
#modalWrap.open{display:flex}
#modal{background:var(--paper);width:100%;max-width:860px;max-height:88vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
#modalHead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#fff}
#modalAyah{font-family:'Amiri Quran',serif;font-size:24px;line-height:2.1;padding:14px 20px;background:#fffdf6;border-bottom:1px solid var(--line);max-height:30vh;overflow-y:auto}
.mtabs{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap;background:#fff}
.mtab{border:1px solid var(--line);background:var(--paper);border-radius:10px 10px 0 0;padding:9px 14px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--green-d)}
.mtab.on{background:var(--green);color:#fff;border-color:var(--green)}
#modalBody{flex:1;overflow-y:auto;padding:16px 20px;font-size:16.5px;line-height:2}
#modalBody .src{font-size:12px;color:var(--muted);margin-top:10px}
#modalFoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;background:#fff}
.mbtn{flex:1;padding:12px;border-radius:12px;border:none;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.mbtn.play{background:var(--green);color:#fff}
.mbtn.close{background:var(--paper-d);color:var(--green-d)}
.sabab{background:#f4fbf7;border:1px solid #cfe6d8;border-radius:12px;padding:14px 16px}
.sabab h4{margin:0 0 8px;color:var(--green-d)}
/* ===== audio player ===== */
#player{position:fixed;bottom:0;right:0;left:0;background:linear-gradient(180deg,#fffdf6,#f8f1de);border-top:2px solid var(--gold);padding:10px 14px;z-index:60;display:none;box-shadow:0 -4px 18px rgba(0,0,0,.12)}
#player.open{display:block}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:1000px;margin:0 auto}
.pbtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--green);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.pbtn.small{width:36px;height:36px;font-size:14px;background:var(--paper-d);color:var(--green-d);border:1px solid var(--line)}
.psel{padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-family:inherit;font-size:13px;font-weight:700;color:var(--green-d);background:#fff}
.ptoggle{padding:8px 12px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.ptoggle.on{background:var(--green);color:#fff;border-color:var(--green)}
#pinfo{font-size:12.5px;font-weight:700;color:var(--green-d);min-width:120px;text-align:center}
#repeatMsg{text-align:center;font-size:13px;font-weight:800;color:var(--orange);min-height:20px}
/* ===== adhkar ===== */
.dhk{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff}
.dhk .txt{font-size:16.5px;line-height:2}
.dhk .row{display:flex;align-items:center;gap:8px;margin-top:10px}
.count-b{margin-inline-start:auto;background:var(--green);color:#fff;border-radius:20px;padding:6px 16px;font-weight:800;font-size:14px;cursor:pointer;border:none;font-family:inherit}
.count-b.done{background:var(--gold)}
.reset-b{background:var(--paper-d);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--green-d)}
.src-note{font-size:11.5px;color:var(--muted);margin-top:8px}
/* ===== tajweed rules ===== */
.rule-cat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.rule-cat h4{margin:0 0 10px;color:var(--green-d);font-size:16px}
.rule{display:flex;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14.5px;line-height:1.9}
.rule:first-of-type{border-top:none}
.rule .rn{font-weight:800;color:var(--green-d);white-space:nowrap}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:6px}
.asma-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
/* ===== loader / misc ===== */
#loader{position:fixed;inset:0;background:var(--green-d);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:14px}
#loader .t{font-size:26px;font-weight:800;color:var(--gold-l)}
#lbar{width:min(320px,70vw);height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
#lbar i{display:block;height:100%;width:0;background:var(--gold);border-radius:6px;transition:width .2s}
#lmsg{font-size:14px;opacity:.85}
.searchres{padding:8px 0}
.sr-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sr-item:hover{background:#fff}
.sr-item .k{font-size:12px;color:var(--muted);font-weight:700}
.sr-item .tx{font-family:'Amiri Quran',serif;font-size:19px;line-height:2}
@media(max-width:700px){
  /* ===== phone layout: bigger text, bigger touch targets ===== */
  .qtext{font-size:24px;line-height:2.4}
  #reader{padding:8px 8px 175px}
  .mushaf{padding:20px 12px;border-radius:14px}
  .brand{font-size:17px}
  .brand small{display:none}
  #menuBtn{padding:10px 15px;font-size:20px;background:var(--gold);border-color:var(--gold);color:#3a2f05;font-weight:800}
  .searchbox{order:3;flex-basis:100%;max-width:none;margin-top:6px}
  .searchbox input{padding:11px 16px;font-size:15px}
  .hbtn{padding:10px 15px;font-size:15px;min-height:46px;min-width:46px}
  #crumb{padding:8px 12px 2px;font-size:14px}
  /* sidebar: roomy tappable rows */
  .stab{font-size:14px;padding:13px 4px}
  .sitem{padding:14px 12px}
  .sitem .nm{font-size:16px}
  .sitem .num{min-width:38px;height:38px;font-size:14px}
  .sfilter{padding:12px;font-size:15px}
  /* ayah numbers easy to tap */
  .ayah-num{min-width:40px;height:40px;font-size:16px}
  /* ===== audio player: big visible controls ===== */
  #player{padding:12px 10px 14px}
  .prow{gap:10px;justify-content:center}
  .pbtn{width:58px;height:58px;font-size:23px;box-shadow:0 3px 10px rgba(13,92,70,.35)}
  .pbtn.small{width:48px;height:48px;font-size:18px;box-shadow:none}
  .psel{font-size:14.5px;padding:12px 10px;flex:1 1 28%;min-height:48px}
  .ptoggle{font-size:15px;font-weight:800;padding:14px 12px;flex:1 1 42%;min-height:52px;border-width:2px}
  #pinfo{flex-basis:100%;font-size:14px}
  #repeatMsg{font-size:14px}
  /* ===== ayah modal: big tabs & buttons ===== */
  .mtab{font-size:15px;padding:12px 18px}
  .mbtn{padding:16px;font-size:17px;border-radius:14px}
  #modalAyah{font-size:25px}
  #modalBody{font-size:17.5px}
  #modalHead{font-size:16px}
  /* adhkar counters */
  .dhk .txt{font-size:17px}
  .count-b{padding:11px 26px;font-size:16px}
  .reset-b{padding:10px 18px;font-size:13.5px}
  /* asma grid: bigger cards on phone */
  .asma-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))!important;gap:10px!important}
  .sajda{font-size:.75em;padding:2px 10px}
  .divmark{font-size:13.5px;padding:5px 14px}
  /* sidebar as overlay drawer on phone: never squeezes the surah */
  #sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:90;box-shadow:0 0 30px rgba(0,0,0,.3);transition:transform .28s ease}
  #app.sb-closed #sidebar{margin-inline-end:0;transform:translateX(105%)}
  #sbClose{display:block;width:calc(100% - 20px);margin:10px 10px 0;padding:14px;border:none;border-radius:12px;background:var(--green);color:#fff;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer}
}
</style>
</head>
<body>
<div id="loader"><div class="t">۞ Koran</div><div id="lbar"><i></i></div><div id="lmsg">جاري التحميل...</div></div>

<header>
  <button id="menuBtn" title="القائمة">☰</button>
  <div class="brand">۞ Koran <small>القرآن الكريم برواية ورش عن نافع</small></div>
  <div class="searchbox"><input id="gsearch" placeholder="بحث: اسم سورة، أو سورة:آية (2:255)، أو كلمة من النص..."></div>
  <div class="hctl">
    <button class="hbtn" id="zoomOut" title="تصغير الخط">أ−</button>
    <button class="hbtn" id="zoomIn" title="تكبير الخط">أ+</button>
    <button class="hbtn on" id="tjToggle" title="تلوين التجويد">التجويد</button>
  </div>
</header>

<div id="app">
  <aside id="sidebar">
    <button id="sbClose">✕ إغلاق القائمة</button>
    <div class="stabs">
      <button class="stab on" data-t="surah">السور</button>
      <button class="stab" data-t="juz">الأجزاء</button>
      <button class="stab" data-t="hizb">الأحزاب</button>
      <button class="stab" data-t="page">الصفحات</button>
      <button class="stab" data-t="adhkar">الأذكار</button>
      <button class="stab" data-t="asma">أسماء الله الحسنى</button>
      <button class="stab" data-t="tajweed">التجويد</button>
    </div>
    <div class="spanel on" id="p-surah"><input class="sfilter" id="surahFilter" placeholder="ابحث باسم السورة..."><div id="surahList"></div></div>
    <div class="spanel" id="p-juz"><div id="juzList"></div></div>
    <div class="spanel" id="p-hizb"><div id="hizbList"></div></div>
    <div class="spanel" id="p-page">
      <div style="display:flex;gap:8px;margin-bottom:10px"><input class="sfilter" style="margin:0" id="pageInput" type="number" min="1" max="604" placeholder="رقم الصفحة (1-604)"><button class="hbtn" style="background:var(--green);border-color:var(--green)" id="pageGo">اذهب</button></div>
      <div class="unit-head">الصفحات الأخيرة زيارة</div><div id="recentPages"></div>
    </div>
    <div class="spanel" id="p-adhkar"><div id="adhkarCats"><div style="text-align:center;color:var(--muted);padding:20px">اضغط لتحميل الأذكار</div></div></div>
    <div class="spanel" id="p-asma"><input class="sfilter" id="asmaFilter" placeholder="ابحث عن اسم..."><div id="asmaList"></div></div>
    <div class="spanel" id="p-tajweed"><div id="tajweedRules"></div></div>
  </aside>
  <main id="main">
    <div id="crumb"></div>
    <div id="reader"><div class="mushaf" id="mushaf"></div></div>
  </main>
</div>

<div id="modalWrap"><div id="modal">
  <div id="modalHead"><b id="modalTitle" style="color:var(--green-d)"></b><span style="flex:1"></span><button class="hbtn" style="background:var(--paper-d);color:var(--green-d);border-color:var(--line)" id="modalClose">✕</button></div>
  <div id="modalAyah"></div>
  <div class="mtabs" id="mtabs"></div>
  <div id="modalBody"></div>
  <div id="modalFoot"><button class="mbtn play" id="mPlay">▶ استمع من هنا</button><button class="mbtn close" id="mClose2">إغلاق</button></div>
</div></div>

<div id="player">
  <div id="repeatMsg"></div>
  <div class="prow">
    <button class="pbtn small" id="pPrev" title="السابق">⏮</button>
    <button class="pbtn" id="pPlay" title="تشغيل/إيقاف">▶</button>
    <button class="pbtn small" id="pNext" title="التالي">⏭</button>
    <select class="psel" id="reciterSel"></select>
    <select class="psel" id="scopeSel">
      <option value="ayah">تكرار: آية</option>
      <option value="page">تكرار: صفحة</option>
      <option value="surah" selected>تكرار: سورة</option>
      <option value="thumn">تكرار: ثمن</option>
      <option value="rub">تكرار: ربع</option>
      <option value="hizb">تكرار: حزب</option>
    </select>
    <select class="psel" id="repSel" title="عدد التكرار">
      <option value="1">مرة 1</option>
      <option value="2">مرتان</option>
      <option value="3" selected>3 مرات</option>
      <option value="5">5 مرات</option>
      <option value="10">10 مرات</option>
      <option value="0">بلا توقف ∞</option>
    </select>
    <button class="ptoggle on" id="tListen">👂 استمع وكرر</button>
    <button class="ptoggle" id="tContinue">⏭ أكمل التلاوة</button>
    <span id="pinfo"></span>
    <button class="pbtn small" id="pClose" title="إغلاق">✕</button>
  </div>
  <audio id="audio" preload="auto"></audio>
</div>

<script>
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const AR_D="٠١٢٣٤٥٦٧٨٩", arN=n=>String(n).replace(/\d/g,d=>AR_D[d]);
const stripHtml=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent||"";};

const ASBAB=[{"a":144,"s":2,"t":"تحويل القبلة","x":"كان النبي ﷺ يصلي نحو بيت المقدس، وكان يحب أن يوجَّه إلى الكعبة، فأنزل الله: ﴿قد نرى تقلب وجهك في السماء فلنولينك قبلة ترضاها﴾، فحوِّلت القبلة إلى المسجد الحرام."},{"a":158,"s":2,"t":"السعي بين الصفا والمروة","x":"كان المسلمون يتحرجون من السعي بين الصفا والمروة لأن المشركين كانوا قد وضعوا عليهما صنمين (إساف ونائلة)، فنزلت: ﴿إن الصفا والمروة من شعائر الله﴾."},{"a":187,"s":2,"t":"الرخصة ليلة الصيام","x":"كان الرجل إذا نام قبل أن يفطر حرم عليه الطعام والشراب والجماع إلى الليلة التالية، فوقع بعض الصحابة في ذلك (منهم عمر رضي الله عنه)، فنزلت الرخصة: ﴿أحل لكم ليلة الصيام الرفث إلى نسائكم﴾."},{"a":197,"s":2,"t":"التزود للحج","x":"كان أهل اليمن يحجون ولا يتزودون ويقولون: نحن المتوكلون، فإذا قدموا مكة سألوا الناس، فنزل: ﴿وتزودوا فإن خير الزاد التقوى﴾."},{"a":219,"s":2,"t":"سؤال عن الخمر والميسر","x":"سأل عمر بن الخطاب ومعاذ بن جبل رضي الله عنهما رسول الله ﷺ عن الخمر والميسر، فنزل: ﴿يسألونك عن الخمر والميسر قل فيهما إثم كبير ومنافع للناس﴾، وكان هذا أول ما نزل في التدرج بتحريم الخمر."},{"a":222,"s":2,"t":"سؤال عن المحيض","x":"سأل الصحابة رسول الله ﷺ عن مباشرة الحائض، فنزل: ﴿ويسألونك عن المحيض قل هو أذى فاعتزلوا النساء في المحيض﴾."},{"a":61,"s":3,"t":"مباهلة وفد نجران","x":"قدم وفد نصارى نجران يحاجّون النبي ﷺ في عيسى عليه السلام، فدعاهم إلى المباهلة: ﴿فقل تعالوا ندع أبناءنا وأبناءكم... ثم نبتهل فنجعل لعنة الله على الكاذبين﴾، فأبوا وصالحوه على الجزية."},{"a":195,"s":3,"t":"ذكر النساء في الهجرة","x":"قالت أم سلمة رضي الله عنها: يا رسول الله، لا أسمع الله ذكر النساء في الهجرة بشيء، فنزل: ﴿فاستجاب لهم ربهم أني لا أضيع عمل عامل منكم من ذكر أو أنثى﴾."},{"a":32,"s":4,"t":"لا تتمنوا ما فضل الله به بعضكم","x":"قالت أم سلمة رضي الله عنها: يا رسول الله، يغزو الرجال ولا نغزو، ولنا نصف الميراث، فنزل: ﴿ولا تتمنوا ما فضل الله به بعضكم على بعض﴾."},{"a":43,"s":4,"t":"الصلاة حال السكر","x":"صنع عبد الرحمن بن عوف طعاما فدعا ناسا من الصحابة وسقاهم من الخمر قبل تحريمها، فقدموا عليا يصلي بهم فقرأ: ﴿قل يا أيها الكافرون﴾ فخلط فيها، فنزل: ﴿لا تقربوا الصلاة وأنتم سكارى حتى تعلموا ما تقولون﴾."},{"a":3,"s":5,"t":"اليوم أكملت لكم دينكم","x":"نزلت يوم عرفة في حجة الوداع، وعمر رضي الله عنه يبكي لما سمعها، وقال: ما بعد الكمال إلا النقصان."},{"a":6,"s":5,"t":"آية الوضوء والتيمم","x":"في غزوة المريسيع ضاع عقد عائشة رضي الله عنها، فأقام الجيش يلتمسه وليس معهم ماء وحضرت الصلاة، فنزلت آية التيمم، فقال أسيد بن حضير: ما هي بأول بركتكم يا آل أبي بكر."},{"a":90,"s":5,"t":"تحريم الخمر","x":"لما شرب حمزة رضي الله عنه الخمر قبل تحريمها فعل ما فعل بناقتي علي رضي الله عنه، وشكا علي ذلك إلى النبي ﷺ، فنزل تحريم الخمر: ﴿يا أيها الذين آمنوا إنما الخمر والميسر والأنصاب والأزلام رجس من عمل الشيطان فاجتنبوه﴾. (صحيح مسلم)"},{"a":101,"s":5,"t":"لا تسألوا عن أشياء إن تبد لكم تسؤكم","x":"كان الصحابة يكثرون سؤال النبي ﷺ عن أشياء، فنهاهم الله عن السؤال عما لم يقع مما يسوؤهم جوابه."},{"a":113,"s":9,"t":"النهي عن الاستغفار للمشركين","x":"لما حضرت أبا طالب الوفاة عرضه النبي ﷺ على الإسلام فأبى، وقال ﷺ: لأستغفرن لك ما لم أنه عنك، فنزل: ﴿ما كان للنبي والذين آمنوا أن يستغفروا للمشركين ولو كانوا أولي قربى﴾. (متفق عليه)"},{"a":106,"s":16,"t":"الإكراه على الكفر","x":"أكره المشركون عمار بن ياسر رضي الله عنه على الكفر فذكر آلهتهم بخير مكرها وقلبه مطمئن بالإيمان، فنزل: ﴿إلا من أكره وقلبه مطمئن بالإيمان﴾."},{"a":85,"s":17,"t":"السؤال عن الروح","x":"سأل اليهود النبي ﷺ عن الروح وهو بالمدينة، فنزل: ﴿ويسألونك عن الروح قل الروح من أمر ربي﴾."},{"a":23,"s":18,"t":"الاستثناء بالمشيئة","x":"سأل المشركون النبي ﷺ عن أهل الكهف وذي القرنين والروح، فقال: أخبركم غدا، ولم يستثن، فتأخر الوحي، فنزل: ﴿ولا تقولن لشيء إني فاعل ذلك غدا * إلا أن يشاء الله﴾."},{"a":11,"s":24,"t":"حادثة الإفك","x":"في غزوة المريسيع تخلفت عائشة رضي الله عنها عن الجيش لالتماس عقدها، فجاء صفوان بن المعطل فأناخ لها جمله، فتكلم المنافقون بالإفك، فأنزل الله براءتها في عشر آيات من سورة النور."},{"a":56,"s":28,"t":"إنك لا تهدي من أحببت","x":"نزلت في أبي طالب عم النبي ﷺ حين أبى أن يقول لا إله إلا الله عند موته، فقال ﷺ: لأستغفرن لك، ثم نهي عن ذلك."},{"a":35,"s":33,"t":"ذكر النساء مع الرجال","x":"قالت أم سلمة رضي الله عنها: ما لنا لا نذكر في القرآن كما يذكر الرجال؟ فنزل: ﴿إن المسلمين والمسلمات والمؤمنين والمؤمنات...﴾."},{"a":37,"s":33,"t":"زواج النبي ﷺ من زينب","x":"لما قضى زيد بن حارثة رضي الله عنه وطره من زينب بنت جحش وطلقها، زوجها الله نبيه ﷺ لإبطال التبني: ﴿فلما قضى زيد منها وطرا زوجناكها﴾."},{"a":2,"s":49,"t":"لا ترفعوا أصواتكم فوق صوت النبي","x":"كان ثابت بن قيس رضي الله عنه جهوري الصوت، فلما نزلت: ﴿لا ترفعوا أصواتكم فوق صوت النبي﴾ جلس في بيته يبكي خوفا أن يكون حبط عمله، فبشره النبي ﷺ بالجنة."},{"a":1,"s":58,"t":"المجادلة في الظهار","x":"ظاهر أوس بن الصامت من امرأته خولة بنت ثعلبة، فجاءت تجادل النبي ﷺ وتشكو إلى الله، فنزل: ﴿قد سمع الله قول التي تجادلك في زوجها﴾، وشرعت كفارة الظهار."},{"a":1,"s":66,"t":"تحريم النبي ﷺ ما أحل الله له","x":"حرّم النبي ﷺ على نفسه العسل (وقيل: مارية) إرضاء لبعض أزواجه، فنزل: ﴿يا أيها النبي لم تحرم ما أحل الله لك تبتغي مرضات أزواجك﴾."},{"a":1,"s":80,"t":"عبس وتولى","x":"جاء عبد الله بن أم مكتوم الأعمى يسأل النبي ﷺ وهو مشغول بدعوة صناديد قريش، فعبس في وجهه وأعرض عنه، فنزل: ﴿عبس وتولى * أن جاءه الأعمى﴾، فكان ﷺ يكرمه بعد ذلك."},{"a":1,"s":93,"t":"فتور الوحي","x":"فتر الوحي عن النبي ﷺ فقالت المشركون: ودعه ربه وقلاه، فنزل: ﴿والضحى * والليل إذا سجى * ما ودعك ربك وما قلى﴾."},{"a":1,"s":96,"t":"أول ما نزل","x":"أول ما نزل من القرآن: ﴿اقرأ باسم ربك الذي خلق﴾، نزل بها جبريل عليه السلام على النبي ﷺ في غار حراء."},{"a":1,"s":108,"t":"سورة الكوثر","x":"قال العاص بن وائل عن النبي ﷺ: إنه أبتر (منقطع لا عقب له)، فنزل: ﴿إنا أعطيناك الكوثر * فصل لربك وانحر * إن شانئك هو الأبتر﴾."},{"a":1,"s":111,"t":"سورة المسد","x":"لما جمع النبي ﷺ قريشا على الصفا ودعاهم إلى الله، قال أبو لهب: تبا لك، ألهذا جمعتنا؟ فنزل: ﴿تبت يدا أبي لهب وتب﴾."},{"a":1,"s":112,"t":"سورة الإخلاص","x":"قال المشركون للنبي ﷺ: انسب لنا ربك، فنزل: ﴿قل هو الله أحد * الله الصمد﴾."},{"a":125,"s":2,"t":"مقام إبراهيم مصلى","x":"قال عمر رضي الله عنه: يا رسول الله، لو اتخذنا من مقام إبراهيم مصلى، فنزل: ﴿واتخذوا من مقام إبراهيم مصلى﴾، وهو من موافقات عمر رضي الله عنه."},{"a":285,"s":2,"t":"آمن الرسول","x":"لما نزل: ﴿وإن تبدوا ما في أنفسكم أو تخفوه يحاسبكم به الله﴾ شق ذلك على الصحابة، فنسخها الله بقوله: ﴿آمن الرسول بما أنزل إليه من ربه﴾... ﴿لا يكلف الله نفسا إلا وسعها﴾."},{"a":110,"s":3,"t":"كنتم خير أمة","x":"قيل: نزلت في المهاجرين الأولين والأنصار، وقيل: في أمة محمد ﷺ عامة: ﴿كنتم خير أمة أخرجت للناس تأمرون بالمعروف وتنهون عن المنكر﴾."},{"a":1,"s":8,"t":"الأنفال","x":"سأل الصحابة عن الغنائم يوم بدر: لمن تكون؟ فنزل: ﴿يسألونك عن الأنفال قل الأنفال لله والرسول﴾."},{"a":59,"s":33,"t":"آية الحجاب","x":"قال عمر رضي الله عنه: يا رسول الله، يدخل عليك البر والفاجر، فلو أمرت أمهات المؤمنين بالحجاب، فنزل: ﴿يا أيها النبي قل لأزواجك وبناتك ونساء المؤمنين يدنين عليهن من جلابيبهن﴾، وهو من موافقات عمر."},{"a":10,"s":60,"t":"امتحان المهاجرات","x":"نزلت في أم كلثوم بنت عقبة لما هاجرت إلى المدينة بعد صلح الحديبية، فأمر الله بامتحان المهاجرات: ﴿يا أيها الذين آمنوا إذا جاءكم المؤمنات مهاجرات فامتحنوهن﴾."},{"a":1,"s":74,"t":"سورة المدثر","x":"من أوائل ما نزل بعد فتور الوحي: ﴿يا أيها المدثر * قم فأنذر﴾، فكان قيام النبي ﷺ بالدعوة."},{"a":8,"s":76,"t":"إطعام الطعام","x":"قيل: نزلت في علي وفاطمة رضي الله عنهما حين آثرا مسكينا ويتيما وأسيرا بطعامهما: ﴿ويطعمون الطعام على حبه مسكينا ويتيما وأسيرا﴾."},{"a":1,"s":113,"t":"المعوذتان","x":"قيل: نزلت المعوذتان حين سحر لبيد بن الأعصم اليهودي النبي ﷺ، فشفاه الله بهما."}];

const ASMA=[{"n":"الله","m":"الاسم الأعظم الدال على الذات المقدسة، الجامع لجميع صفات الكمال والجلال."},{"n":"الرحمن","m":"ذو الرحمة الواسعة التي وسعت كل شيء في الدنيا."},{"n":"الرحيم","m":"المنعم على عباده المؤمنين برحمته الخاصة يوم القيامة."},{"n":"الملك","m":"المالك للملك، المتصرف في خلقه بما يشاء لا معقب لحكمه."},{"n":"القدوس","m":"المنزه عن كل نقص وعيب، الطاهر في ذاته وصفاته وأفعاله."},{"n":"السلام","m":"السالم من كل عيب، المسلِّم عباده من كل ظلم."},{"n":"المؤمن","m":"المصدِّق رسله بالآيات والمعجزات، المؤمِّن عباده من الخوف والظلم."},{"n":"المهيمن","m":"الرقيب الحافظ الشاهد على كل شيء، القائم على خلقه."},{"n":"العزيز","m":"الغالب الذي لا يُقهر ولا يُغلب."},{"n":"الجبار","m":"العالي الذي يجبر الكسير والضعيف، ويقهر الجبابرة."},{"n":"المتكبر","m":"المتعالي عن كل سوء ونقص، وعن صفات الخلق."},{"n":"الخالق","m":"المبدع للخلق من العدم على غير مثال سابق."},{"n":"البارئ","m":"المميِّز للخلق بعضهم من بعض، الخالق من غير احتياج."},{"n":"المصور","m":"الذي صوَّر المخلوقات كما شاء واقتضت حكمته."},{"n":"الغفار","m":"الساتر لذنوب عباده، المتجاوز عنها مهما تكررت."},{"n":"القهار","m":"الغالب لكل شيء، الخاضع له كل موجود."},{"n":"الوهاب","m":"كثير العطاء بلا عوض ولا سؤال."},{"n":"الرزاق","m":"المتكفل بأرزاق العباد، لا ينقص رزقه."},{"n":"الفتاح","m":"الذي يفتح أبواب الرحمة والرزق والعلم لعباده."},{"n":"العليم","m":"المحيط علمه بكل شيء، ظاهرِه وباطنِه."},{"n":"القابض","m":"الذي يقبض الرزق والأرواح بحكمته وعدله."},{"n":"الباسط","m":"الذي يبسط الرزق والرحمة لمن يشاء من عباده."},{"n":"الخافض","m":"الذي يخفض الجبابرة والظالمين والمستكبرين."},{"n":"الرافع","m":"الذي يرفع أولياءه بالطاعات ودرجات الإيمان."},{"n":"المعز","m":"الذي يهب العزة والغلبة لمن يشاء."},{"n":"المذل","m":"الذي يذل من يشاء بعدله وحكمته."},{"n":"السميع","m":"الذي يسمع كل شيء، لا يعزب عنه صوت ولا نجوى."},{"n":"البصير","m":"الذي يرى كل شيء وإن دقَّ وصغُر وخفي."},{"n":"الحكم","m":"الحاكم العدل الذي لا رادَّ لقضائه."},{"n":"العدل","m":"المنزه عن الظلم والجور في أقواله وأفعاله."},{"n":"اللطيف","m":"البرُّ بعباده، الرفيق بهم من /* ================= TAJWEED COLORIZER — Warsh ================= */
const HAMZA=new Set(["\u0621","\u0623","\u0625","\u0624","\u0626"]);
const QALQ=new Set(["\u0642","\u0637","\u0628","\u062C","\u062F"]);
const IKHFA_L=new Set(["\u062A","\u062B","\u062C","\u062F","\u0630","\u0632","\u0633","\u0634","\u0635","\u0636","\u0637","\u0638","\u0641","\u0642","\u0643"]);
const IDGHAM_GH=new Set(["\u064A","\u0646","\u0645","\u0648"]);
const MADD_L=new Set(["\u0627","\u0648","\u064A"]);
const WAQF_SKIP=new Set([" ","\u06D6","\u06EA","\u200F"]);
const isLetter=ch=>/[\u0621-\u064A\u0670\u06D2]/.test(ch);
function splitClusters(text){
  const out=[];let cur=null;
  for(const ch of text){
    const cp=ch.codePointAt(0);
    const comb=(cp>=0x64B&&cp<=0x655)||cp===0x670||cp===0x6DF||cp===0x6E2||cp===0x6E5||cp===0x6E6||cp===0x6E7||cp===0x6E8||cp===0x6EA||cp===0x6EC||(cp>=0x8F0&&cp<=0x8F2);
    if(comb&&cur){cur.marks+=ch;cur.cps.push(cp);}
    else{cur={base:ch,marks:"",cps:[]};out.push(cur);}
  }
  return out;
}
const has=(cl,cp)=>cl.cps.includes(cp);
const isBare=cl=>!cl.cps.some(c=>(c>=0x64B&&c<=0x655)||c===0x670||(c>=0x8F0&&c<=0x8F2));
function nextLetterIdx(cls,i){
  for(let j=i+1;j<cls.length;j++){const b=cls[j].base;if(WAQF_SKIP.has(b))continue;if(isLetter(b))return j;if(b==="\u06DE")continue;return -1;}
  return -1;
}
function prevLetterIdx(cls,i){
  for(let j=i-1;j>=0;j--){const b=cls[j].base;if(WAQF_SKIP.has(b))continue;if(isLetter(b))return j;return -1;}
  return -1;
}
function lastWordStart(cls){
  // index of first cluster of the last word (letters only at end)
  let j=cls.length-1;
  while(j>=0&&(WAQF_SKIP.has(cls[j].base)||cls[j].base==="\u06DE"||cls[j].base==="\u06E9"))j--;
  while(j>=0&&isLetter(cls[j].base))j--;
  return j+1;
}
function colorize(text){
  const cls=splitClusters(text);
  const lw=lastWordStart(cls);
  const spans=new Array(cls.length).fill(null);
  const badge=(i,html)=>{spans[i]={badge:html};};
  for(let i=0;i<cls.length;i++){
    const cl=cls[i],b=cl.base;
    if(b==="\u06DE")continue; // strip embedded rub marks (we render our own)
    if(b==="\u06E9"){badge(i,'<span class="sajda" title="سجدة تلاوة">۩</span>');continue;}
    if(WAQF_SKIP.has(b))continue;
    // --- maddah ---
    if(has(cl,0x653)||b==="\u0622"){
      const nl=nextLetterIdx(cls,i);
      if(cl.cps.includes(0x6E5)||cl.cps.includes(0x6E6)){spans[i]={c:"md-munf",t:"مد صلة كبرى — كحكم المنفصل"};continue;}
      if(nl>=0&&has(cls[nl],0x651)){spans[i]={c:"md-lazim",t:"مد لازم — ٦ حركات لزوما"};continue;}
      if(nl>=0&&HAMZA.has(cls[nl].base)){spans[i]={c:"md-mut",t:"مد واجب متصل — ٦ حركات عند ورش"};continue;}
      // word end?
      let j=i+1,wordEnd=false,nextWordFirst=null,nextWordHamza=false;
      while(j<cls.length&&(WAQF_SKIP.has(cls[j].base)||cls[j].base==="\u06DE")){if(cls[j].base===" ")wordEnd=true;j++;}
      if(j<cls.length&&wordEnd){nextWordFirst=cls[j].base;nextWordHamza=HAMZA.has(cls[j].base)||cls[j].cps.includes(0x654)||cls[j].cps.includes(0x655);}
      else if(j>=cls.length)wordEnd=true;
      if(wordEnd&&nextWordFirst&&nextWordHamza){spans[i]={c:"md-munf",t:"مد جائز منفصل — ٦ حركات عند ورش"};continue;}
      spans[i]={c:"md-faded",t:"مد"};continue;
    }
    // small waw/yeh = silat sughra
    if(cl.cps.includes(0x6E5)||cl.cps.includes(0x6E6)){spans[i]={c:"md-faded",t:"مد صلة صغرى"};continue;}
    // badal: hamza at word start + madd letter
    if((b==="\u0621"||b==="\u0623"||b==="\u0625")){
      const pl=prevLetterIdx(cls,i);
      const atStart=pl<0||cls[pl+1].base===" "||(pl>=0&&false);
      const prevIsSpace=i===0||cls[i-1].base===" "||WAQF_SKIP.has(cls[i-1].base);
      const nl=nextLetterIdx(cls,i);
      if(prevIsSpace&&nl===i+1&&MADD_L.has(cls[nl].base)&&!has(cls[nl],0x653)){spans[i]={c:"md-faded",t:"مد بدل — ٢ أو ٤ أو ٦ حركات"};spans[nl]={c:"md-faded",t:"مد بدل"};continue;}
    }
    // ghunna: noon/meem mushaddad
    if((b==="\u0646"||b==="\u0645")&&has(cl,0x651)){spans[i]={c:"ghunna",t:"غنة"};continue;}
    // iqlab mark
    if(has(cl,0x6E2)){spans[i]={c:"iqlab",t:"إقلاب"};continue;}
    // tanween (open or regular): ikhfa/idgham/iqlab — at ayah end it's iwad/waqf
    if(cl.cps.some(c=>(c>=0x8F0&&c<=0x8F2)||c===0x64B||c===0x64C||c===0x64D)){
      if(i>=lw){
        if(has(cl,0x64B)||has(cl,0x8F0))spans[i]={c:"md-faded",t:"مد عوض عند الوقف"};
      }else{
        const tn=nextLetterIdx(cls,i);
        if(tn>=0){const tb=cls[tn].base;
          if(IDGHAM_GH.has(tb))spans[i]={c:"ghunna",t:"إدغام بغنة"};
          else if(tb==="\u0644"||tb==="\u0631")spans[i]={c:"ghunna",t:"إدغام بغير غنة"};
          else if(tb==="\u0628")spans[i]={c:"iqlab",t:"إقلاب"};
          else if(IKHFA_L.has(tb))spans[i]={c:"ikhfa",t:"إخفاء حقيقي"};
        }
      }
      continue;
    }
    // noon sakina rules
    if(b==="\u0646"&&(has(cl,0x652)||isBare(cl))){
      const nl=nextLetterIdx(cls,i);
      if(nl>=0){const nb=cls[nl].base;
        let gap=false;for(let j=i+1;j<nl;j++){if(cls[j].base===" "){gap=true;break;}}
        if(IDGHAM_GH.has(nb)&&gap)spans[i]={c:"ghunna",t:"إدغام بغنة"};
        else if((nb==="\u0644"||nb==="\u0631")&&gap)spans[i]={c:"ghunna",t:"إدغام بغير غنة"};
        else if(nb==="\u0628")spans[i]={c:"iqlab",t:"إقلاب"};
        else if(IKHFA_L.has(nb))spans[i]={c:"ikhfa",t:"إخفاء حقيقي"};
      }
      continue;
    }
    // meem sakina + ba
    if(b==="\u0645"&&(has(cl,0x652)||isBare(cl))){
      const nl=nextLetterIdx(cls,i);
      if(nl>=0){let gap=false;for(let j=i+1;j<nl;j++){if(cls[j].base===" "){gap=true;break;}}
        if(gap&&cls[nl].base==="\u0628")spans[i]={c:"ikhfa",t:"إخفاء شفوي"};
        else if(gap&&cls[nl].base==="\u0645")spans[i]={c:"ghunna",t:"إدغام شفوي"};
      }
      continue;
    }
    // qalqala
    if(QALQ.has(b)&&(has(cl,0x652)||isBare(cl))){
      const qn=nextLetterIdx(cls,i),qb=qn>=0?cls[qn].base:null;
      const qbMadd=qb&&"\u0627\u0648\u064A\u0649".includes(qb);
      const qbIdgham=qn>=0&&has(cls[qn],0x651)&&qb&&"\u062A\u062F\u0637\u0630\u0638\u062B".includes(qb);
      if(!qbMadd&&!qbIdgham)spans[i]={c:"qalqala",t:"قلقلة"};
      continue;
    }
    // silent (rounded zero)
    if(has(cl,0x6DF)){spans[i]={c:"silent",t:"لا تُلفظ"};continue;}
    // alef tafreeq: wa + alef at word end
    if(b==="\u0627"){
      const pl=prevLetterIdx(cls,i);
      if(pl>=0&&cls[pl].base==="\u0648"){
        let j=i+1,end=true;
        while(j<cls.length){const bb=cls[j].base;if(isLetter(bb)){end=false;break;}j++;}
        if(end){spans[i]={c:"silent",t:"ألف التفريق — لا تُلفظ"};continue;}
      }
      // iwad: alef after fathatan at ayah end
      if(i>=lw&&pl>=0&&has(cls[pl],0x64B)){spans[i]={c:"md-faded",t:"مد عوض عند الوقف"};continue;}
    }
    // imala
    if(has(cl,0x6E7)){spans[i]={c:"imala",t:"إمالة / تقليل"};continue;}
    // madd leen at waqf
    if((b==="\u0648"||b==="\u064A")&&(has(cl,0x652)||isBare(cl))&&i>=lw){
      const pl=prevLetterIdx(cls,i);
      if(pl>=0&&has(cls[pl],0x64E)){spans[i]={c:"md-faded",t:"مد لين عند الوقف"};continue;}
    }
  }
  // build html
  let html="";
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  for(let i=0;i<cls.length;i++){
    const cl=cls[i],b=cl.base;
    if(b==="\u06DE")continue;
    const sp=spans[i];
    if(sp&&sp.badge){html+=sp.badge;continue;}
    const chunk=esc(b+cl.marks);
    if(sp)html+=`<span class="${sp.c}" title="${sp.t}">${chunk}</span>`;
    else html+=chunk;
  }
  return html;
}

const ayahText=k=>TEXT[k]||"";
function idxToKey(i){
  // via surah verse counts
  let s=1;
  while(i>=SURAHS[s-1].verses){i-=SURAHS[s-1].verses;s++;}
  return s+":"+(i+1);
}
function keyToIdx(k){const[s,a]=parseKey(k);let i=a-1;for(let x=1;x<s;x++)i+=SURAHS[x-1].verses;return i;}
function rangeKeys(unit,n){const[i0,i1]=RANGES[unit][n-1];const out=[];for(let i=i0;i<=i1;i++)out.push(idxToKey(i));return out;}
function unitLabel(unit,n){
  const[s0,a0]=parseKey(idxToKey(RANGES[unit][n-1][0]));
  const[s1,a1]=parseKey(idxToKey(RANGES[unit][n-1][1]));
  const nm={juz:"الجزء",hizb:"الحزب",rub:"الربع",thumn:"الثمن",page:"الصفحة"}[unit];
  return `${nm} ${arN(n)} — من ${SURAH_NAME(s0)} ${arN(a0)} إلى ${SURAH_NAME(s1)} ${arN(a1)}`;
}

/* ---------- rendering ---------- */
function divBadges(key){
  const m=MARKERS[key];if(!m)return"";
  let h="";
  for(const x of m){
    if(x.startsWith("jz"))h+=`<span class="divmark jz">۞ الجزء ${arN(x.slice(2))}</span>`;
    else if(x.startsWith("hz"))h+=`<span class="divmark hz">۞ الحزب ${arN(x.slice(2))}</span>`;
    else if(x.startsWith("ns"))h+=`<span class="divmark">النصف</span>`;
    else if(x.startsWith("rb"))h+=`<span class="divmark">الربع ${arN(x.slice(2))}</span>`;
    else if(x.startsWith("th"))h+=`<span class="divmark">الثمن ${arN(x.slice(2))}</span>`;
  }
  return h;
}
function ayahHTML(key){
  const[s,a]=parseKey(key);
  const t=state.tajweed?colorize(ayahText(key)):cleanText(ayahText(key));
  return `${divBadges(key)}<span class="ayah" data-k="${key}">${t}<span class="ayah-num">${arN(a)}</span></span> `;
}
function cleanText(t){
  // strip embedded rub marks, render sajdah
  return t.replace(/\u06DE/g,"").replace(/\u06E9/g,'<span class="sajda" title="سجدة تلاوة">۩</span>')
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function basmalaHTML(){return `<div class="basmala">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;}

function render(){
  const R=$("#reader"),M=$("#mushaf");
  M.classList.toggle("tj",state.tajweed);
  M.style.fontSize=""; // qtext uses em
  document.querySelector(".qtext")?.style.setProperty("font-size",state.fontSize+"px");
  const C=$("#crumb");
  if(state.mode==="surah"){
    const s=state.ref,meta=SURAHS[s-1];
    C.textContent=`سورة ${meta.name} — ${meta.verses} آية (${meta.revelation==="Meccan"?"مكية":"مدنية"})`;
    let h=`<div class="surah-head"><div class="frame"><h2>سورة ${meta.name}</h2><div class="meta">${meta.revelation==="makkah"?"مكية":"مدنية"} • ${arN(meta.verses)} آية</div></div></div>`;
    if(SURAHS_SABAB[s])h+=`<div class="sabab-surah"><b>سبب نزول السورة: </b>${SURAHS_SABAB[s]}<div class="src-note">نبذة مختصرة — قيد التدقيق</div></div>`;
    h+=surahNavHTML(s);
    if(s!==1&&s!==9)h+=basmalaHTML();
    h+=`<div class="qtext" style="font-size:${state.fontSize}px">`;
    for(let a=1;a<=meta.verses;a++)h+=ayahHTML(s+":"+a);
    h+=`</div>`;
    h+=surahNavHTML(s);
    M.innerHTML=h;
  }else if(state.mode==="page"){
    const p=state.ref,keys=rangeKeys("page",p);
    const divs=keys.map(k=>{const[s,a]=parseKey(k);const d=kDiv(k);return d;});
    C.textContent=`صفحة ${arN(p)} من المصحف`;
    let h=`<div class="page-frame"><div class="qtext" style="font-size:${state.fontSize}px">`;
    let lastSurah=0;
    for(const k of keys){
      const[s,a]=parseKey(k);
      if(s!==lastSurah){h+=`<div class="surah-head"><div class="frame"><h2>سورة ${SURAH_NAME(s)}</h2></div></div>`;if(s!==1&&s!==9&&a===1)h+=basmalaHTML();lastSurah=s;}
      else if(a===1&&s!==1&&s!==9)h+=basmalaHTML();
      h+=ayahHTML(k);
    }
    h+=`</div><div class="page-foot"><div class="surnav"><button class="snbtn" data-pg="-1"${p<=1?" disabled":""}>الصفحة السابقة ▶</button><button class="snbtn" data-pg="1"${p>=604?" disabled":""}>◀ الصفحة التالية</button></div><div>صفحة ${arN(p)}</div></div>`;
    M.innerHTML=h;
  }else{
    const unit=state.mode,n=state.ref,keys=rangeKeys(unit,n);
    C.textContent=unitLabel(unit,n);
    let h=`<div class="qtext" style="font-size:${state.fontSize}px">`;
    let lastSurah=0;
    for(const k of keys){
      const[s,a]=parseKey(k);
      if(s!==lastSurah){h+=`<div class="surah-head"><div class="frame"><h2>سورة ${SURAH_NAME(s)}</h2></div></div>`;if(s!==1&&s!==9&&a===1)h+=basmalaHTML();lastSurah=s;}
      else if(a===1&&s!==1&&s!==9)h+=basmalaHTML();
      h+=ayahHTML(k);
    }
    h+=`</div>`;
    M.innerHTML=h;
  }
  $("#reader").scrollTop=0;
  bindAyahs();
}

function renderTajweedTab(){
  let h=`<div class="unit-head">مفتاح الألوان (برواية ورش)</div><div class="rule-cat">`;
  for(const[cls,label,desc]of TJ_LEGEND)h+=`<div class="rule"><span class="rn"><span class="swatch" style="background:var(--${cls.replace("md-lazim","red-d").replace("md-mut","red").replace("md-munf","orange").replace("md-faded","faded")})"></span></span><span><b>${label}:</b> ${desc}</span></div>`;
  h+=`</div>`;

  }

  $("#tajweedRules").innerHTML=h;
}
/* ---------- global search ---------- */
function doSearch(q){
  q=q.trim();if(!q)return;
  // surah:ayah pattern
  let m=q.match(/^(\d+)\s*[:/]\s*(\d+)$/);
  if(m){const s=+m[1],a=+m[2];if(s>=1&&s<=114&&a>=1&&a<=SURAHS[s-1].verses){gotoSurah(s);setTimeout(()=>scrollToAyah(s+":"+a),400);}return;}
  // surah name (+ optional ayah number)
  m=q.match(/^([\u0621-\u064A\s]+?)\s*(\d+)?$/);
  if(m){
    const name=m[1].trim(),an=m[2]?+m[2]:null;
    const s=SURAHS.find(x=>x.name===name||x.name.replace(/ة/g,"ه")===name||name.includes(x.name)||x.name.includes(name));
    if(s){gotoSurah(s.id);if(an&&an<=s.verses)setTimeout(()=>scrollToAyah(s.id+":"+an),400);return;}
  }
  // full text search
  if(!state.textLoaded)return;
  const res=[];
  const nq=q.replace(/[\u064B-\u0655\u0670]/g,"");
  for(let s=1;s<=114&&res.length<60;s++)for(let a=1;a<=SURAHS[s-1].verses;a++){
    const t=TEXT[s+":"+a];
    if(t&&t.replace(/[\u064B-\u0655\u0670]/g,"").includes(nq)){res.push(s+":"+a);if(res.length>=60)break;}
  }
  state.mode="search";
  $("#crumb").textContent=`نتائج البحث عن: ${q} (${arN(res.length)} آية)`;
  $("#mushaf").innerHTML=`<div class="searchres">`+(res.length?res.map(k=>{
    const[s,a]=parseKey(k);
    return `<div class="sr-item" data-k="${k}"><div class="k">سورة ${SURAH_NAME(s)} — آية ${arN(a)}</div><div class="tx">${state.tajweed?colorize(ayahText(k)):cleanText(ayahText(k))}</div></div>`;
  }).join(""):`<div style="padding:30px;text-align:center;color:var(--muted)">لا توجد نتائج</div>`)+`</div>`;
  $$(".sr-item").forEach(el=>el.onclick=()=>{const[s]=parseKey(el.dataset.k);gotoSurah(s);setTimeout(()=>scrollToAyah(el.dataset.k),400);});
}
function scrollToAyah(key){
  const el=document.querySelector(`#mushaf .ayah[data-k="${key}"]`);
  if(el){el.scrollIntoView({block:"center"});el.style.background="#ffe9a8";setTimeout(()=>el.style.background="",1600);}
}

let modalKey=null, modalTab="muyassar";
const MTABS=[["muyassar","الميسر"],["sadi","السعدي"],["kathir","ابن كثير"],["jalalayn","الجلالين"],["sabab","سبب النزول"]];
function openAyah(key){

function closeModal(){$("#modalWrap").classList.remove("open");}
async function renderModalBody(){
  const B=$("#modalBody"),[s,a]=parseKey(modalKey),tab=modalTab;
  if(modalTab==="sabab"){
    const f=ASBAB.find(x=>x.s===s&&x.a===a);
    B.innerHTML=f?`<div class="sabab"><h4>سبب نزول الآية ${arN(a)} من سورة ${SURAH_NAME(s)}</h4><div>${f.x}</div><div class="src">من أشهر أسباب النزول المروية — القائمة منتقاة وليست شاملة</div></div>`
      :`<div style="color:var(--muted);text-align:center;padding:20px">لا يوجد سبب نزول مشهور مذكور لهذه الآية في القائمة المنتقاة.<br>غالب الآيات نزلت ابتداءً من غير سبب خاص.</div>`;
    return;
  }
  const ck=modalTab+":"+modalKey;
  B.innerHTML=`<div style="text-align:center;color:var(--muted);padding:20px">جاري تحميل ${TAFSIR_NAMES[modalTab]}...</div>`;
  try{
    let txt=TAFSIR_CACHE[ck];
    if(!txt){
      if(modalTab==="jalalayn")txt=await jalalaynText(s,a);
      else{
        const r=await fetch(`https://api.quran.com/api/v4/tafsirs/${TAFSIR_IDS[modalTab]}/by_ayah/${s}:${a}`);
        const d=await r.json();txt=stripHtml(d.tafsir?.text||"");
      }
      TAFSIR_CACHE[ck]=txt;
    }
    if(tab!==modalTab)return;
    B.innerHTML=`<div>${txt.replace(/\n/g,"<br>")}</div><div class="src">المصدر: ${TAFSIR_NAMES[modalTab]}${modalTab==="jalalayn"?" — نص الجلالين العربي":" — عبر Quran.com"}</div>`;
  }catch(e){B.innerHTML=`<div style="color:var(--red-d);text-align:center;padding:20px">تعذر تحميل التفسير. تحقق من الاتصال وحاول مجددا.</div>`;}
}
async function jalalaynText(s,a){
  if(!JAL_DATA){
    const r=await fetch(JALALAYN_URL);const d=await r.json();
    JAL_DATA={};for(const v of d.quran||d)JAL_DATA[v.chapter+":"+v.verse]=v.text;
  }
  return JAL_DATA[s+":"+a]||"لا يوجد تفسير الجلالين لهذه الآية.";
}

const AU={queue:[],qi:0,rep:0,playing:false,waitTimer:null};
const audio=()=>$("#audio");
const pad3=n=>String(n).padStart(3,"0");
const audioURL=(key,rec)=>{const[s,a]=parseKey(key);return AUDIO_BASE+rec.folder+"/"+pad3(s)+pad3(a)+".mp3";};
const curReciter=()=>RECITERS.find(r=>r.id===$("#reciterSel").value)||RECITERS[0];
function unitContaining(unit,key){
  const idx=keyToIdx(key);
  const arr=RANGES[unit];
  for(let n=1;n<=arr.length;n++){if(idx>=arr[n-1][0]&&idx<=arr[n-1][1])return n;}
  return 1;
}
function scopeKeys(scope,key){
  if(scope==="ayah")return[key];
  if(scope==="surah"){const[s]=parseKey(key);const out=[];for(let a=1;a<=SURAHS[s-1].verses;a++)out.push(s+":"+a);return out;}
  const n=unitContaining(scope,key);
  return rangeKeys(scope,n);
}
function startAudio(fromKey){
  const scope=$("#scopeSel").value;
  AU.queue=scopeKeys(scope,fromKey);
  AU.qi=Math.max(0,AU.queue.indexOf(fromKey));
  AU.rep=0;
  $("#player").classList.add("open");
  playCurrent();
}
function playCurrent(){
  clearTimeout(AU.waitTimer);
  const key=AU.queue[AU.qi];if(!key){stopAudio();return;}
  const a=audio();a.src=audioURL(key,curReciter());a.play().catch(()=>nextAyah());
  AU.playing=true;$("#pPlay").textContent="⏸";
  highlightPlaying(key);updatePinfo();
}
function highlightPlaying(key){
  $$("#mushaf .ayah.playing").forEach(e=>e.classList.remove("playing"));
  const el=document.querySelector(`#mushaf .ayah[data-k="${key}"]`);
  if(el){el.classList.add("playing");el.scrollIntoView({block:"center",behavior:"smooth"});}
}
function updatePinfo(){
  const key=AU.queue[AU.qi];if(!key)return;
  const[s,a]=parseKey(key);
  const repN=+$("#repSel").value;
  $("#pinfo").textContent=`${SURAH_NAME(s)} ${arN(a)} • ${arN(AU.qi+1)}/${arN(AU.queue.length)} • تكرار ${repN===0?"∞":arN(AU.rep+1)+"/"+arN(repN)}`;
}
function nextAyah(){
  AU.qi++;AU.rep=0;$("#repeatMsg").textContent="";
  if(AU.qi>=AU.queue.length){
    if($("#tContinue").classList.contains("on")){
      // extend to next unit of same scope
      const scope=$("#scopeSel").value,last=AU.queue[AU.queue.length-1];
      let more=[];
      if(scope==="surah"){const[s]=parseKey(last);if(s<114){more=[];for(let a=1;a<=SURAHS[s].verses;a++)more.push((s+1)+":"+a);}}
      else if(scope!=="ayah"){const n=unitContaining(scope,last);const arr=RANGES[scope];if(n<arr.length)more=rangeKeys(scope,n+1);}
      if(more.length){AU.queue=AU.queue.concat(more);playCurrent();return;}
    }
    stopAudio();return;
  }
  playCurrent();
}
function prevAyah(){if(AU.qi>0){AU.qi--;AU.rep=0;$("#repeatMsg").textContent="";playCurrent();}}
function stopAudio(){AU.playing=false;clearTimeout(AU.waitTimer);audio().pause();$("#pPlay").textContent="▶";$("#repeatMsg").textContent="";$$("#mushaf .ayah.playing").forEach(e=>e.classList.remove("playing"));}
function togglePlay(){
  if(!AU.queue.length)return;
  if(AU.playing){audio().pause();AU.playing=false;$("#pPlay").textContent="▶";clearTimeout(AU.waitTimer);$("#repeatMsg").textContent="";}
  else{audio().play().catch(()=>{});AU.playing=true;$("#pPlay").textContent="⏸";}
}
function onAudioEnded(){
  const repN=+$("#repSel").value;
  AU.rep++;
  if(repN!==0&&AU.rep>=repN){nextAyah();return;}
  updatePinfo();
  if($("#tListen").classList.contains("on")){
    $("#repeatMsg").textContent="🔁 كرر الآن مع القارئ...";
    AU.waitTimer=setTimeout(()=>{if(!AU.playing)return;$("#repeatMsg").textContent="";audio().currentTime=0;audio().play().catch(()=>nextAyah());},2800);
  }else{audio().currentTime=0;audio().play().catch(()=>nextAyah());}
}
function wireAudio(){
  const r=$("#reciterSel");
  r.innerHTML=RECITERS.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
  r.onchange=()=>{if(AU.queue.length)playCurrent();};
  $("#pPlay").onclick=togglePlay;
  $("#pNext").onclick=()=>{clearTimeout(AU.waitTimer);$("#repeatMsg").textContent="";nextAyah();};
  $("#pPrev").onclick=prevAyah;
  $("#pClose").onclick=()=>{stopAudio();$("#player").classList.remove("open");AU.queue=[];};
  $("#scopeSel").onchange=()=>{if(AU.queue.length){const k=AU.queue[AU.qi];startAudio(k);}};
  $("#repSel").onchange=updatePinfo;
  $("#tListen").onclick=e=>e.target.classList.toggle("on");
  $("#tContinue").onclick=e=>e.target.classList.toggle("on");
  audio().addEventListener("ended",onAudioEnded);
  audio().addEventListener("error",()=>{/* skip missing file */if(AU.playing)nextAyah();});
  $("#mPlay").onclick=()=>{closeModal();startAudio(modalKey);};
}
/* ================= ADHKAR ================= */
const ADH_BASE="https://raw.githubusercontent.com/hanimohsen31/adhkar-json/main";
async function loadAdhkar(){
  const box=$("#adhkarCats");
  box.innerHTML=`<div style="text-align:center;color:var(--muted);padding:20px">جاري تحميل الأذكار...</div>`;
  try{
    const r=await fetch(ADHKAR_URL);ADHKAR=await r.json();
    box.innerHTML=ADHKAR.map((c,i)=>`<div class="sitem" data-c="${i}"><span class="num">${arN(c.array.length)}</span><span><span class="nm">${c.category}</span></span><span class="go">‹</span></div>`).join("");
    box.querySelectorAll(".sitem").forEach(el=>el.onclick=()=>showAdhkarCat(+el.dataset.c));
  }catch(e){box.innerHTML=`<div style="text-align:center;color:var(--red-d);padding:20px">تعذر التحميل. <button class="hbtn" style="background:var(--green);border-color:var(--green)" onclick="loadAdhkar()">إعادة المحاولة</button></div>`;}
}
function showAdhkarCat(i){
  const c=ADHKAR[i],box=$("#adhkarCats");
  box.innerHTML=`<button class="hbtn" style="background:var(--paper-d);color:var(--green-d);border-color:var(--line);margin-bottom:10px" onclick="loadAdhkar()">› رجوع للفئات</button>
  <div class="unit-head" style="margin-top:0">${c.category} (${arN(c.array.length)})</div>
  <div class="src-note" style="margin-bottom:10px">المصدر: كتاب حصن المسلم — اضغط على العدد لإنقاصه مع الذكر</div>`
  +c.array.map(d=>`
   <div class="dhk" id="dhk-${d.id}">
     <div class="txt">${d.text}</div>
     <div class="row">
       ${d.audio?`<button class="pbtn small" onclick="new Audio('${ADH_BASE}${d.audio}').play()" title="استماع">🔊</button>`:""}
       <button class="count-b" data-n="${d.count}" data-left="${d.count}" onclick="dhkTap(this)">× ${arN(d.count)}</button>
       <button class="reset-b" onclick="dhkReset(this)">إعادة</button>
     </div>
   </div>`).join("");
}
function dhkTap(btn){
  let left=+btn.dataset.left;
  if(left<=0)return;
  left--;btn.dataset.left=left;
  const n=+btn.dataset.n;
  btn.textContent=left===0?"✓ تم":"× "+arN(left);
  if(left===0)btn.classList.add("done");
}
function dhkReset(btn){
  const b=btn.parentElement.querySelector(".count-b");
  b.dataset.left=b.dataset.n;b.textContent="× "+arN(+b.dataset.n);b.classList.remove("done");
}
/* ================= INIT ================= */
function wireUI(){
  $("#menuBtn").onclick=()=>$("#app").classList.toggle("sb-closed");
$("#sbClose").onclick=()=>$("#app").classList.add("sb-closed");
$("#sidebar").addEventListener("click",e=>{
  if(window.innerWidth>=760)return;
  if(e.target.closest("#pageGo")){$("#app").classList.add("sb-closed");return;}
  const it=e.target.closest(".sitem");
  if(!it)return;
  if(it.closest("#p-adhkar")||it.closest("#p-asma"))return;
  $("#app").classList.add("sb-closed");
});
  $("#zoomIn").onclick=()=>{state.fontSize=Math.min(46,state.fontSize+2);render();};
  $("#zoomOut").onclick=()=>{state.fontSize=Math.max(20,state.fontSize-2);render();};
  $("#tjToggle").onclick=e=>{state.tajweed=!state.tajweed;e.target.classList.toggle("on",state.tajweed);render();};
  $("#gsearch").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch(e.target.value);});
  $("#modalClose").onclick=closeModal;
  $("#mClose2").onclick=closeModal;
  $("#modalWrap").addEventListener("click",e=>{if(e.target.id==="modalWrap")closeModal();});
  if(window.innerWidth<760)$("#app").classList.add("sb-closed");
}
/* ================= ASMA AL-HUSNA ================= */
function renderAsmaList(filter){
  const box=$("#asmaList");
  const q=(filter||"").trim();
  const list=ASMA.map((a,i)=>({...a,i})).filter(a=>!q||a.n.includes(q));
  box.innerHTML=`<div class="src-note" style="margin-bottom:10px">«إن لله تسعة وتسعين اسمًا، مائة إلا واحدًا، من أحصاها دخل الجنة» — متفق عليه</div>`
   +`<div class="asma-grid">`
   +list.map(a=>`<div class="sitem" style="flex-direction:column;gap:2px;text-align:center;padding:12px 6px" data-i="${a.i}">
      <span style="font-family:'Amiri Quran',serif;font-size:21px;color:var(--green-d)">${a.n}</span>
      <span class="sub">${arN(a.i+1)}</span></div>`).join("")+`</div>`;
  box.querySelectorAll(".sitem").forEach(el=>el.onclick=()=>showAsma(+el.dataset.i));
}
function showAsma(i){
  const a=ASMA[i],box=$("#asmaList");
  box.innerHTML=`
   <button class="hbtn" style="background:var(--paper-d);color:var(--green-d);border-color:var(--line);margin-bottom:10px" id="asmaBack">› رجوع للأسماء</button>
   <div class="rule-cat" style="text-align:center">
     <div style="font-size:13px;color:var(--muted)">الاسم ${arN(i+1)} من ${arN(99)}</div>
     <div style="font-family:'Amiri Quran',serif;font-size:44px;color:var(--green-d);margin:8px 0">${a.n}</div>
     <div style="font-size:16.5px;line-height:2.1;max-width:520px;margin:0 auto">${a.m}</div>
     <div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
       <button class="hbtn" style="background:var(--green);border-color:var(--green)" id="asmaPrev" ${i===0?"disabled style='opacity:.4'":""}>› السابق</button>
       <button class="hbtn" style="background:var(--green);border-color:var(--green)" id="asmaNext" ${i===98?"disabled style='opacity:.4'":""}>التالي ‹</button>
     </div>
   </div>`;
  $("#asmaBack").onclick=()=>renderAsmaList($("#asmaFilter").value);
  const pv=$("#asmaPrev"),nx=$("#asmaNext");
  if(pv&&i>0)pv.onclick=()=>showAsma(i-1);
  if(nx&&i<98)nx.onclick=()=>showAsma(i+1);
}
function wireAsma(){
  $("#asmaFilter").oninput=e=>renderAsmaList(e.target.value);
  renderAsmaList("");
}
document.addEventListener("DOMContentLoaded",async()=>{
  wireUI();buildSidebar();wireAudio();wireAsma();
  await loadText();
  render();
});
</script>
